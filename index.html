<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiffany Zou's Calgary Trip | Home</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <nav class="navbar md:navbar-expand bg-1 fg-2">
    <div class="container-fluid">

        <a class="navbar-brand" href="index.html">Moments in Alberta</a>
        
        <button class="btn-icon navbar-toggler" type="button"
        data-bs-toggle="drawer"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>

        <dialog class="drawer drawer-end" tabindex="-1"
        id="navbarNav" aria-labelledby="navbarNavLabel">

        <div class="drawer-header">
            <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
            <button type="button" class="btn-close"
            data-bs-dismiss="drawer" aria-label="Close"></button>
        </div>

        <div class="drawer-body">
            <ul class="navbar-nav">

            <li class="nav-item">
                <a class="nav-link active" aria-current="page"
                href="index.html">Home</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#">My Trip</a>
            </li>

            <li class="nav-item">
                <a class="nav-link"
                href="contact.html">Contact</a>
            </li>

            </ul>
        </div>
        </dialog>

    </div>
    </nav>
    
    <main class="container mt-5">

        <h1>Through My Lens</h1>
        <p>Welcome to my travel diary!</p>

        <div id="calgaryCarousel" class="carousel carousel-overlay slide mt-4">

            <div class="carousel-inner rounded-5">

                <div class="carousel-item active">
                    <img src="images/calgary1.jpg"
                        class="d-block w-100"
                        alt="Calgary Tower">
                </div>

                <div class="carousel-item">
                    <img src="images/calgary2.jpg"
                        class="d-block w-100"
                        alt="Special architecture">
                </div>

                <div class="carousel-item">
                    <img src="images/calgary3.jpg"
                        class="d-block w-100"
                        style="object-fit: cover;"
                        alt="Stephen Avenue Walk">
                </div>

            </div>

            <div class="carousel-overlay-controls">

                <div>
                    <button class="btn-icon btn-sm btn-subtle theme-secondary"
                            type="button"
                            data-bs-target="#calgaryCarousel"
                            data-bs-slide="prev">
                        <span class="carousel-icon-prev" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>

                    <button class="btn-icon btn-sm btn-subtle theme-secondary"
                            type="button"
                            data-bs-target="#calgaryCarousel"
                            data-bs-slide="next">
                        <span class="carousel-icon-next" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>

                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#calgaryCarousel"
                            data-bs-slide-to="0" class="active"
                            aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#calgaryCarousel"
                            data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#calgaryCarousel"
                            data-bs-slide-to="2" aria-label="Slide 3"></button>
                </div>

            </div>
        </div>

    </main>

    <footer class="container mt-5">
        <p>© 2026 Tiffany Zou's Calgary Trip</p>
    </footer>

</body>
</html>
